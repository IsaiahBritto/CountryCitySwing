<div style="font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto">
  <h2 style="color:#F2C94C;margin-bottom:20px">Reset your password</h2>
  <p style="font-size:16px;line-height:1.6">Hi,</p>
  <p style="font-size:16px;line-height:1.6">We received a request to reset the password for <strong>{{ .Email }}</strong>.</p>
  <p style="font-size:16px;line-height:1.6">Click the button below to set a new password. This link expires in 1 hour.</p>
  <div style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;background-color:#F2C94C;color:#1a1a1a;text-decoration:none;border-radius:8px;font-size:16px;font-weight:bold">Set new password</a>
  </div>
  <p style="font-size:14px;line-height:1.6;color:#888">If you didn't request a password reset, you can ignore this email.</p>
  <p style="margin-top:30px;color:#888;font-size:14px">— The Country City Swing Team</p>
</div>
